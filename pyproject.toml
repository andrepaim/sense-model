[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sense-model"
version = "0.1.0"
description = "Train, evaluate and publish compact models that select word meanings in context"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.6", "transformers>=5.0,<6", "numpy>=1.26", "huggingface-hub>=0.30", "safetensors>=0.5"]

[project.optional-dependencies]
train = ["accelerate>=1.0"]
prepare = ["wn>=0.13"]
pilot = ["pypdf>=5"]
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.3"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
wsd = "wsd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
wsd = ["annotation_web/*.html", "annotation_web/*.js", "annotation_web/*.css"]
